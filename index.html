<!DOCTYPE html>
<html lang="uz">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedFlashCards — Hujayraviy moslashuvlar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#172033}
header{background:#1264a3;color:white;text-align:center;padding:25px 15px}
header h1{margin:0 0 8px}
main{max-width:850px;margin:auto;padding:18px}
.controls{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;padding:13px;border:1px solid #ccd5e0;border-radius:10px;font-size:16px}
button{padding:11px 14px;border:1px solid #ccd5e0;border-radius:10px;background:white;cursor:pointer}
button:hover{background:#e8f2fa}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:15px}
.tabs button.active{background:#1264a3;color:white}
.card{background:white;border-radius:18px;padding:28px;min-height:300px;
box-shadow:0 5px 25px #0001;cursor:pointer}
.badge{display:inline-block;background:#e5f1fb;color:#1264a3;
padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.q{font-size:23px;font-weight:bold;line-height:1.45;margin:25px 0}
.a{background:#eef7ff;padding:16px;border-radius:12px;font-size:18px;line-height:1.5}
.progress{text-align:center;color:#687789;margin:12px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1}
section{margin-top:35px}
.mcq{background:white;padding:18px;border-radius:15px;margin:12px 0}
.option{display:block;width:100%;text-align:left;margin:8px 0}
.correct{background:#d9f4df!important}
.wrong{background:#ffe0e0!important}
.result{font-weight:bold;margin-top:10px}
footer{text-align:center;padding:30px;color:#777}
</style>
</head>

<body>

<header>
<h1>🩺 MedFlashCards</h1>
<p>Hujayraviy moslashuvlar — Interaktiv flesh-kartochkalar</p>
</header>

<main>

<div class="controls">
<input id="search" placeholder="🔎 Savolni qidiring...">
<button onclick="shuffle()">🔀</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="progress" id="progress"></div>

<div class="card" id="card" onclick="flip()"></div>

<div class="progress">👆 Kartochkani bosing — javob ochiladi</div>

<div class="nav">
<button onclick="prev()">← Oldingi</button>
<button onclick="next()">Keyingi →</button>
</div>

<section>
<h2>📝 Mini-MCQ</h2>
<div id="mcq"></div>
</section>

</main>

<footer>
© MedFlashCards.uz
</footer>

<script>

const cards = [

["ASOSIY","Hujayraviy moslashuvning 4 turi qaysilar?",
"Gipertrofiya, giperplaziya, atrofiya va metaplaziya."],

["ASOSIY","Hujayraviy moslashuv nima?",
"Hujayraning patologik ta’sirga moslashib, yashashi va faoliyatini davom ettirishiga yordam beradigan, odatda qaytuvchan o‘zgarishlar majmuasi."],

["ASOSIY","Hujayraviy moslashuvda nimalar o‘zgarishi mumkin?",
"Hujayraning hajmi, soni, fenotipi, moddalar almashinuvi yoki funksiyasi."],

["ASOSIY","Hujayraning jarohatga javobi nimalarga bog‘liq?",
"Jarohat turi, davomiyligi va og‘irlik darajasiga."],

["GIPERTROFIYA","Gipertrofiya nima?",
"To‘qima yoki a’zo hujayralari hajmining kattalashishi natijasida uning umumiy hajmining ortishi."],

["GIPERTROFIYA","Gipertrofiyada hujayralar soni asosiy tarzda o‘zgaradimi?",
"Yo‘q. Asosiy o‘zgarish — mavjud hujayralarning kattalashishi."],

["GIPERTROFIYA","Gipertrofiyaning asosiy sababi nima?",
"Hujayraning funksional yuklamasi yoki ish hajmining ortishi."],

["GIPERTROFIYA","Gipertrofiyaga fiziologik misol?",
"Muntazam jismoniy mashq qiluvchi odamlarda skelet mushaklarining kattalashishi."],

["GIPERTROFIYA","Homiladorlikda bachadon kattalashishida qaysi jarayonlar qatnashadi?",
"Silliq mushak hujayralarining gormonlar ta’siridagi gipertrofiyasi va ayrim hollarda giperplaziyasi."],

["GIPERTROFIYA","Chap qorincha gipertrofiyasining muhim sabablaridan ikkitasi?",
"Uzoq davom etuvchi arterial gipertoniya va yurak klapanlari kasalliklari, masalan, aorta stenozi."],

["GIPERTROFIYA","Siydik yo‘li uzoq vaqt to‘silganda qaysi mushak gipertrofiyalanishi mumkin?",
"Siydik pufagi mushak qavati."],

["GIPERTROFIYA","Gipertrofiyaning asosiy hujayraviy mexanizmi nima?",
"Hujayraviy oqsillar sintezining kuchayishi."],

["GIPERPLAZIYA","Giperplaziya nima?",
"Hujayralar sonining ko‘payishi natijasida to‘qima yoki a’zo hajmining ortishi."],

["GIPERPLAZIYA","Giperplaziya uchun hujayraning qanday xususiyati kerak?",
"Bo‘linish va ko‘payish qobiliyati."],

["GIPERPLAZIYA","Giperplaziyaning fiziologik mexanizmlari qaysilar?",
"Gormonal va kompensator giperplaziya."],

["GIPERPLAZIYA","Kompensator giperplaziyaga misol?",
"Jigarning bir qismi olib tashlangandan keyin qolgan jigar to‘qimasining tiklanishi."],

["GIPERPLAZIYA","Ko‘krak bezlarida fiziologik giperplaziya qachon kuzatilishi mumkin?",
"Balog‘at davrida, homiladorlikda va emizish davrida."],

["GIPERPLAZIYA","Patologik giperplaziyaga misollar?",
"Endometriy giperplaziyasi va prostata bezining yaxshi sifatli giperplaziyasi."],

["GIPERPLAZIYA","Prostata bezining yaxshi sifatli giperplaziyasida qaysi gormon hosilasi muhim?",
"Dihidrotestosteron (DHT)."],

["ATROFIYA / METAPLAZIYA","Atrofiya nima?",
"Hujayra hajmining kichrayishi; ko‘pincha buning natijasida a’zo yoki to‘qima hajmi kamayadi."],

["ATROFIYA / METAPLAZIYA","Atrofiyaning asosiy mexanizmlari qaysilar?",
"Oqsil sintezining kamayishi va oqsillar parchalanishining kuchayishi."],

["ATROFIYA / METAPLAZIYA","Atrofiyaning asosiy sabablarini sanang.",
"Harakatsizlik, nerv ta’minotining yo‘qolishi, qon ta’minotining kamayishi, uzoq davom etuvchi bosim va oziqlanish yetishmovchiligi."],

["ATROFIYA / METAPLAZIYA","Metaplaziya nima?",
"Bir yetilgan hujayra turining boshqa yetilgan hujayra turi bilan almashishi."],

["ATROFIYA / METAPLAZIYA","Metaplaziya qaytuvchanmi?",
"Odatda qaytuvchan moslashuv hisoblanadi."],

["ATROFIYA / METAPLAZIYA","Metaplaziya ko‘pincha qanday ta’sir fonida rivojlanadi?",
"Uzoq davom etuvchi yoki takroriy ta’sirlovchi omil/jarohat fonida."],

["ATROFIYA / METAPLAZIYA","Metaplaziyaning biologik ma’nosi nima?",
"Hujayraning noqulay muhitga moslashib, ta’sirga chidamliroq hujayra turiga o‘tishi."],

["ATROFIYA / METAPLAZIYA","Metaplaziya sababini bartaraf etilsa nima bo‘lishi mumkin?",
"Metaplaziya regressga uchrab, avvalgi hujayra turi tiklanishi mumkin."],

["ADASHTIRMANG","Hujayra kattalashdi, lekin hujayralar soni o‘zgarmadi. Bu nima?",
"Gipertrofiya."],

["ADASHTIRMANG","Hujayralar soni ko‘paydi. Bu nima?",
"Giperplaziya."],

["ADASHTIRMANG","Hujayra kichraydi. Bu nima?",
"Atrofiya."],

["ADASHTIRMANG","Bir yetilgan hujayra turi boshqa yetilgan hujayra turi bilan almashdi. Bu nima?",
"Metaplaziya."],

["ADASHTIRMANG","Gipertrofiya va giperplaziya birga uchrashi mumkinmi?",
"Ha. Masalan, homiladorlikdagi bachadonda ikkala jarayon ham qatnashishi mumkin."],

["KLINIK","Uzoq yillik arterial gipertoniyasi bo‘lgan bemorda chap qorincha devori qalinlashgan. Qaysi moslashuv?",
"Gipertrofiya."],

["KLINIK","Sportchi muntazam mashq qilgach skelet mushaklari kattalashdi. Qaysi jarayon?",
"Fiziologik mushak gipertrofiyasi."],

["KLINIK","Jigarning bir qismi olib tashlanganidan keyin qolgan jigar to‘qimasi tiklanmoqda. Qaysi moslashuv?",
"Kompensator giperplaziya."],

["KLINIK","Siydik yo‘li uzoq vaqt to‘silgan bemorda siydik pufagi mushaklari qalinlashgan. Qaysi jarayon?",
"Patologik gipertrofiya."],

["KLINIK","Odam uzoq vaqt harakat qilmagach mushak hajmi kamaydi. Qaysi jarayon?",
"Harakatsizlikka bog‘liq atrofiya."],

["KLINIK","Surunkali ta’sirlovchi omil natijasida bir yetilgan epiteliy turi boshqa yetilgan epiteliy turi bilan almashdi. Bu nima?",
"Metaplaziya."]

];

let filtered=[...cards];
let pos=0;
let answer=false;
let category="BARCHASI";

const tabs=document.getElementById("tabs");
const categories=["BARCHASI",...new Set(cards.map(x=>x[0]))];

categories.forEach(c=>{
let b=document.createElement("button");
b.textContent=c;
b.onclick=()=>{
category=c;
pos=0;
answer=false;
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
filter();
};
tabs.appendChild(b);
});
tabs.firstChild.classList.add("active");

function filter(){
let s=document.getElementById("search").value.toLowerCase();
filtered=cards.filter(x=>
(category==="BARCHASI"||x[0]===category)&&
(x[1].toLowerCase().includes(s)||x[2].toLowerCase().includes(s))
);
if(pos>=filtered.length)pos=0;
show();
}

document.getElementById("search").oninput=filter;

function show(){
let card=document.getElementById("card");

if(!filtered.length){
card.innerHTML="<div class='q'>Hech narsa topilmadi 😕</div>";
document.getElementById("progress").textContent="0 / 0";
return;
}

let x=filtered[pos];

card.innerHTML=
"<span class='badge'>"+x[0]+"</span>"+
"<div class='q'>"+x[1]+"</div>"+
(answer?"<div class='a'>💡 "+x[2]+"</div>":"");

document.getElementById("progress").textContent=
(pos+1)+" / "+filtered.length;
}

function flip(){
answer=!answer;
show();
}

function next(){
if(!filtered.length)return;
pos=(pos+1)%filtered.length;
answer=false;
show();
}

function prev(){
if(!filtered.length)return;
pos=(pos-1+filtered.length)%filtered.length;
answer=false;
show();
}

function shuffle(){
filtered.sort(()=>Math.random()-0.5);
pos=0;
answer=false;
show();
}

show();

const tests=[
["Qaysi holatda hujayralar soni emas, asosan hajmi ortadi?",
["Jigar tiklanishi","Endometriy giperplaziyasi","Chap qorincha gipertrofiyasi","Prostata giperplaziyasi"],2],

["Qaysi moslashuvda hujayralar soni ortadi?",
["Gipertrofiya","Giperplaziya","Atrofiya","Metaplaziya"],1],

["Bir yetilgan hujayra turi boshqa yetilgan hujayra turi bilan almashsa, bu nima?",
["Atrofiya","Gipertrofiya","Metaplaziya","Nekroz"],2]
];

const box=document.getElementById("mcq");

tests.forEach((t,i)=>{
let d=document.createElement("div");
d.className="mcq";

let h="<b>"+(i+1)+". "+t[0]+"</b>";

t[1].forEach((o,j)=>{
h+="<button class='option' onclick='check(this,"+j+","+t[2]+")'>"+
String.fromCharCode(65+j)+") "+o+"</button>";
});

h+="<div class='result'></div>";
d.innerHTML=h;
box.appendChild(d);
});

function check(btn,choice,correct){
let box=btn.parentElement;
let buttons=box.querySelectorAll(".option");

buttons.forEach(x=>x.disabled=true);

let result=box.querySelector(".result");

if(choice===correct){
btn.classList.add("correct");
result.textContent="✅ To‘g‘ri javob!";
}else{
btn.classList.add("wrong");
buttons[correct].classList.add("correct");
result.textContent="❌ Noto‘g‘ri. To‘g‘ri javob ko‘rsatildi.";
}
}

</script>

</body>
</html>
