
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedFlashCards</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: auto;
}

h1 {
    color: #1f2937;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    margin-top: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    min-height: 180px;
}

.question {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 25px;
}

.answer {
    display: none;
    font-size: 18px;
    color: #374151;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

.show {
    background: #2563eb;
    color: white;
}

.next {
    background: #16a34a;
    color: white;
}

.progress {
    margin-top: 20px;
    color: #6b7280;
}
</style>
</head>

<body>

<div class="container">

<h1>🩺 MedFlashCards</h1>

<p>Pathology Flashcards</p>

<div class="card">

<div class="question" id="question">
What is coagulative necrosis?
</div>

<div class="answer" id="answer">
Coagulative necrosis is a type of cell death in which the tissue architecture is preserved for several days despite cell death.
</div>

<button class="show" onclick="showAnswer()">
Show Answer
</button>

<button class="next" onclick="nextCard()">
Next →
</button>

</div>

<div class="progress" id="progress">
Card 1 / 3
</div>

</div>

<script>

const cards = [

{
question: "What is coagulative necrosis?",
answer: "Coagulative necrosis is a type of cell death in which the tissue architecture is preserved for several days despite cell death."
},

{
question: "What is liquefactive necrosis?",
answer: "Liquefactive necrosis is characterized by enzymatic digestion of dead cells, resulting in transformation of tissue into a liquid mass."
},

{
question: "What is caseous necrosis?",
answer: "Caseous necrosis is a form of necrosis with a soft, cheese-like appearance, classically associated with tuberculosis."
}

];

let current = 0;

function showAnswer() {
    document.getElementById("answer").style.display = "block";
}

function nextCard() {

    current++;

    if (current >= cards.length) {
        current = 0;
    }

    document.getElementById("question").innerText =
        cards[current].question;

    document.getElementById("answer").innerText =
        cards[current].answer;

    document.getElementById("answer").style.display = "none";

    document.getElementById("progress").innerText =
        "Card " + (current + 1) + " / " + cards.length;
}

</script>

</body>
</html>
